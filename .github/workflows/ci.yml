name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # pmx pins an old setuptools in its build requirements, so it is installed
  # separately with build isolation disabled rather than as a dependency.
  PMX_REF: e7b6a00c25c12cdd8fabe32929ec2dc2fee76ff3

jobs:
  smoke:
    name: Install from clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pmx
        run: |
          python -m pip install --upgrade pip setuptools wheel setuptools_scm
          python -m pip install --no-build-isolation \
            "pmx @ git+https://github.com/deGrootLab/pmx@${PMX_REF}"

      - name: Install package
        run: python -m pip install .

      - name: Check the CLI responds
        run: |
          resdel --help
          resdel prepare --help
          resdel transform --help
          resdel analyze --help

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check src/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pmx
        run: |
          python -m pip install --upgrade pip setuptools wheel setuptools_scm
          python -m pip install --no-build-isolation \
            "pmx @ git+https://github.com/deGrootLab/pmx@${PMX_REF}"

      - name: Install package with test dependencies
        run: python -m pip install ".[dev]"

      - name: Run pytest
        run: pytest -v
